     package icon.svg in the repository root and part of the retro theme of
     section 32.2: a raised grey window with the classic navy title bar, and the
     three keys of the default multisig setup. The 192 and 512 px PNGs are not
     built here: the manifest still points at this SVG with sizes "any", which is
     what the manifest test asserts. -->
