<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#c0c0c0">
    <meta name="robots" content="noindex, nofollow">
    <title>History — VardKey</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <script src="/session.js" defer></script>
    <script src="/history.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="VardKey dashboard">
        <img class="brand-mark" src="/icon.svg" alt="" aria-hidden="true">
        <span>VardKey</span>
      </a>
    </header>

    <main class="page-shell">
      <div class="page-heading form-heading">
        <div>
          <p class="eyebrow">Saved results</p>
          <h1>History</h1>
          <p class="intro">Every saved annual health check, newest first. Saved checks are never overwritten.</p>
        </div>
        <!-- The export link lives here now, with no `download` attribute, so the
             dated filename from Content-Disposition is the one that wins
             (sections 31 point 3 and 32.7 point 5). -->
        <a class="secondary-button" href="/api/export">Download CSV</a>
      </div>

      <section class="section-block" aria-labelledby="history-list-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">All checks</p>
            <h2 id="history-list-title">Saved health checks</h2>
          </div>
        </div>
        <div id="history-list" aria-live="polite"><p class="empty-state">Loading saved checks…</p></div>
      </section>

      <section class="section-block" id="history-detail" aria-labelledby="history-detail-title" hidden>
        <div class="section-heading">
          <div>
            <p class="eyebrow">Read-only</p>
            <h2 id="history-detail-title">Health check</h2>
          </div>
        </div>
        <div id="history-detail-body"></div>
      </section>
    </main>
    <footer class="footer"><span>VardKey</span></footer>
  </body>
</html>
